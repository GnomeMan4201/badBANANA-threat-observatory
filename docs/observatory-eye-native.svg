<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="badBANANA Observatory animated eye">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#ffd66a"/><stop offset=".18" stop-color="#f7b84e"/><stop offset=".36" stop-color="#67c8ff"/><stop offset=".68" stop-color="#2c8fd2"/><stop offset="1" stop-color="#0e426f"/></radialGradient>
    <radialGradient id="sclera" cx="55%" cy="45%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset=".72" stop-color="#e9eef3"/><stop offset="1" stop-color="#c8d2dc"/></radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#181a21"/><stop offset=".5" stop-color="#2c252b"/><stop offset="1" stop-color="#090a0d"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000" opacity=".28"/></pattern>
    <clipPath id="eyeClip"><path d="M55 180 C120 74 220 46 320 50 C425 47 523 78 585 180 C520 281 422 311 320 308 C218 311 120 282 55 180Z"/></clipPath>
    <style>
      .iris{transform-box:fill-box;transform-origin:center;animation:irisPulse 5.2s ease-in-out infinite}.pupil{transform-box:fill-box;transform-origin:center;animation:pupil 5.2s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}.glint{animation:sweep 5.2s ease-in-out infinite}.blink{transform-origin:320px 180px;animation:blink 7.5s ease-in-out infinite}
      @keyframes irisPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes pupil{0%,100%{transform:scale(1)}40%{transform:scale(.78)}60%{transform:scale(.88)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes sweep{0%,12%{opacity:0;transform:translateX(-120px)}25%,55%{opacity:.9}70%,100%{opacity:0;transform:translateX(180px)}}@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
    </style>
  </defs>
  <rect width="640" height="360" fill="#07090d"/>
  <g class="blink" clip-path="url(#eyeClip)">
    <rect width="640" height="360" fill="url(#sclera)"/>
    <g class="iris"><circle cx="320" cy="180" r="126" fill="#0c3453"/><circle cx="320" cy="180" r="118" fill="url(#iris)"/>
      <g class="ring" opacity=".58" stroke="#07121f" stroke-width="7"><line x1="320" y1="66" x2="320" y2="122"/><line x1="320" y1="238" x2="320" y2="294"/><line x1="206" y1="180" x2="262" y2="180"/><line x1="378" y1="180" x2="434" y2="180"/><line x1="239" y1="99" x2="278" y2="138"/><line x1="362" y1="222" x2="401" y2="261"/><line x1="401" y1="99" x2="362" y2="138"/><line x1="278" y1="222" x2="239" y2="261"/></g>
      <circle cx="320" cy="180" r="86" fill="none" stroke="#ffd45d" stroke-width="9" opacity=".72" filter="url(#glow)"/><circle class="pupil" cx="320" cy="180" r="72" fill="#05060b"/><circle cx="320" cy="180" r="60" fill="#101427" opacity=".7"/><ellipse class="glint" cx="282" cy="134" rx="27" ry="15" fill="#fff" opacity=".86"/><circle cx="345" cy="152" r="9" fill="#d9f4ff" opacity=".75"/>
    </g><rect width="640" height="360" fill="url(#dots)" opacity=".45"/>
  </g>
  <path d="M25 179 C110 54 214 24 320 28 C432 24 541 63 616 179" fill="none" stroke="url(#lid)" stroke-width="42" stroke-linecap="round"/><path d="M25 181 C112 307 215 335 320 332 C434 335 542 299 616 181" fill="none" stroke="url(#lid)" stroke-width="42" stroke-linecap="round"/><path d="M56 180 C120 74 220 46 320 50 C425 47 523 78 585 180 C520 281 422 311 320 308 C218 311 120 282 56 180Z" fill="none" stroke="#11141a" stroke-width="11"/><path d="M78 180 C143 93 228 68 320 69 C414 67 498 94 565 180" fill="none" stroke="#c46a62" stroke-width="5" opacity=".58"/>
</svg>
