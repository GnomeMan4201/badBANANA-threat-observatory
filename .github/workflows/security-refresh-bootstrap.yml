name: security refresh bootstrap

on:
  push:
    branches: [chore/security-refresh-2026-09-09]

permissions:
  contents: write

concurrency:
  group: security-refresh-bootstrap
  cancel-in-progress: true

jobs:
  refresh-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/security-refresh-2026-09-09
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Regenerate lockfile from patched constraints
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Production build and complete test suite
        run: npm test

      - name: Verify diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- package-lock.json

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches patched constraints.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: regenerate audited dependency lockfile'
          git push origin HEAD:chore/security-refresh-2026-09-09
