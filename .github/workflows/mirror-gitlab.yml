name: mirror-gitlab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror all GitHub branches and tags to GitLab
        shell: bash
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          token=$(printf '%s' "$GITLAB_MIRROR_TOKEN" | tr -d '[:space:]')
          test -n "$token"

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --tags
          git remote set-head origin -d 2>/dev/null || true
          git remote add gitlab 'https://gitlab.com/GnomeMan/badBANANA-threat-observatory.git'

          auth=$(printf 'oauth2:%s' "$token" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic $auth" push --prune gitlab 'refs/remotes/origin/*:refs/heads/*'
          git -c http.extraHeader="Authorization: Basic $auth" push --prune gitlab 'refs/tags/*:refs/tags/*'

          expected_main=$(git rev-parse refs/remotes/origin/main)
          actual_main=$(git -c http.extraHeader="Authorization: Basic $auth" ls-remote gitlab refs/heads/main | awk '{print $1}')
          test "$actual_main" = "$expected_main"
