name: mirror-gitlab

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push GitHub main and tags to GitLab
        shell: bash
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          token=$(printf '%s' "$GITLAB_MIRROR_TOKEN" | tr -d '[:space:]')
          test -n "$token"

          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          git remote add gitlab 'https://gitlab.com/GnomeMan/badBANANA-threat-observatory.git'

          auth=$(printf 'oauth2:%s' "$token" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic $auth" push gitlab refs/remotes/origin/main:refs/heads/main
          git -c http.extraHeader="Authorization: Basic $auth" push gitlab --tags

          expected=$(git rev-parse refs/remotes/origin/main)
          actual=$(git -c http.extraHeader="Authorization: Basic $auth" ls-remote gitlab refs/heads/main | awk '{print $1}')
          test "$actual" = "$expected"
