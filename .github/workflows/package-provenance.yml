name: package release provenance

on:
  pull_request:
    paths:
      - '.github/workflows/package-provenance.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and package provenance
        shell: bash
        run: |
          set -euo pipefail
          main=$(git rev-parse refs/remotes/origin/main)
          release=$(git rev-parse refs/remotes/origin/release/v1.2.0)
          test "$main" = "45f22e3d3ed522c3afb8d7882e7a68d0ad7919e5"
          test "$release" = "$main"
          git diff --exit-code "$main" "$release"
          test "$(git rev-list --left-right --count "$main...$release")" = $'0\t0'
          git branch main-audit "$main"
          git branch release-v1.2.0-audit "$release"
          {
            echo "repository=GnomeMan4201/badBANANA-threat-observatory"
            echo "main=$main"
            echo "release/v1.2.0=$release"
            echo "left_right_count=$(git rev-list --left-right --count "$main...$release")"
            echo "main_tree=$(git rev-parse "$main^{tree}")"
            echo "release_tree=$(git rev-parse "$release^{tree}")"
            echo
            echo "show-ref:"
            git show-ref --heads main-audit release-v1.2.0-audit
          } > RELEASE_PROVENANCE.txt
          git bundle create release-provenance-45f22e3.bundle main-audit release-v1.2.0-audit
          git bundle verify release-provenance-45f22e3.bundle > BUNDLE_VERIFY.txt 2>&1
          sha256sum release-provenance-45f22e3.bundle RELEASE_PROVENANCE.txt BUNDLE_VERIFY.txt > SHA256SUMS.txt

      - name: Upload provenance package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: badBANANA-release-provenance-45f22e3
          path: |
            release-provenance-45f22e3.bundle
            RELEASE_PROVENANCE.txt
            BUNDLE_VERIFY.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
