name: deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build and complete test suite
        run: npm test

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production security headers
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl --fail --silent --show-error --dump-header - --output /dev/null https://badbanana-threat-observatory.badbanana6969.workers.dev/)
          grep -qi '^content-security-policy:' <<< "$headers"
          grep -qi '^x-content-type-options:[[:space:]]*nosniff' <<< "$headers"
          grep -qi '^referrer-policy:[[:space:]]*no-referrer' <<< "$headers"
          grep -qi '^x-frame-options:[[:space:]]*DENY' <<< "$headers"
          grep -qi '^permissions-policy:' <<< "$headers"
